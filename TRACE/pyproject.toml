[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-fact-checking"
version = "1.0.0"
description = "TRACE: Tree-Structured Reasoning for Multi-Table Multi-Hop Fact-Checking"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Senyi Zhang"},
  {name = "Dongwon Lee"},
  {name = "Delvin Ce Zhang"},
]
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "sentence-transformers>=3.0",
  "torch>=2.1",
  "tqdm>=4.66",
  "transformers>=4.44",
  "wordfreq>=3.1",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.8"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
trace = "trace_fc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

